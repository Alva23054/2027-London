<!DOCTYPE html>
<html lang="zh-Hant">https://github.com/Alva23054/2027-London/blob/main/index.html
<head>
<meta charset="UTF-8">
<title>台北 → 倫敦｜英國馬拉松行程</title>
<style>
  :root{
    --navy:#1c2b45;
    --navy-light:#26385a;
    --ink:#1c2333;
    --muted:#8891a3;
    --line:#e7e9ee;
    --bg:#f7f8fa;
    --card:#ffffff;
    --必去:#1f9d55;
    --建議:#2b6fe0;
    --美食:#d98c1f;
    --備選:#9aa2b1;
    --pill-bg:#eef1f6;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",-apple-system,BlinkMacSystemFont,sans-serif;
    background:var(--bg);
    color:var(--ink);
  }
  .header{
    background:linear-gradient(135deg,var(--navy) 0%, var(--navy-light) 100%);
    color:#fff;
    padding:28px 32px 22px;
  }
  .header h1{
    margin:0 0 6px;
    font-size:28px;
    font-weight:700;
    letter-spacing:.3px;
  }
  .header .sub{
    color:#b9c2d6;
    font-size:14px;
    margin-bottom:18px;
  }
  .tagrow{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
  }
  .tag{
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.18);
    padding:8px 14px;
    border-radius:999px;
    font-size:13px;
    white-space:nowrap;
  }
  .legend{
    display:flex;
    align-items:center;
    gap:18px;
    padding:16px 32px;
    border-bottom:1px solid var(--line);
    background:#fff;
    font-size:13px;
    color:#555;
    flex-wrap:wrap;
  }
  .legend b{color:var(--ink);font-weight:600;margin-right:4px;}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;}
  .tabs{
    display:flex;
    background:#fff;
    border-bottom:1px solid var(--line);
    overflow-x:auto;
  }
  .tab{
    flex:1;
    min-width:130px;
    text-align:center;
    padding:16px 8px 12px;
    cursor:pointer;
    color:var(--muted);
    border-bottom:3px solid transparent;
    user-select:none;
  }
  .tab .d{font-weight:700;font-size:15px;}
  .tab .date{font-size:12px;margin-top:2px;}
  .tab.active{color:var(--navy);border-bottom-color:var(--navy);}
  .tab.active .d{color:var(--navy);}
  .day{display:none;padding:24px 32px 48px;max-width:820px;margin:0 auto;}
  .day.active{display:block;}
  .daytags{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
  .daytag{background:#fdeecb;color:#8a5b12;font-size:13px;padding:7px 14px;border-radius:8px;font-weight:600;}
  .daytag.blue{background:#e4edfd;color:#2b5fc7;}
  .timeline{display:flex;flex-direction:column;}
  .item{display:flex;align-items:flex-start;gap:14px;}
  .timecol{
    flex:0 0 66px;
    width:66px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .badge{
    width:100%;
    box-sizing:border-box;
    text-align:center;
    background:var(--navy);
    color:#fff;
    font-size:12px;
    font-weight:700;
    padding:6px 4px;
    border-radius:8px;
    line-height:1.25;
    white-space:normal;
    word-break:keep-all;
    overflow-wrap:anywhere;
  }
  .badge.alt{background:#4d5d7c;}
  .connector{
    flex:1;
    width:2px;
    min-height:14px;
    background:var(--line);
    margin:6px 0;
  }
  .item:last-child .connector{visibility:hidden;}
  .content{flex:1;min-width:0;padding-bottom:22px;}
  .content .kicker{font-size:12px;color:var(--muted);margin-bottom:2px;}
  .content h3{margin:0 0 6px;font-size:16px;font-weight:700;}
  .content p{margin:0 0 4px;font-size:13.5px;color:#4a5568;line-height:1.6;}
  .content .meta{font-size:12.5px;color:#8891a3;margin-top:6px;line-height:1.7;}
  .content ul{margin:6px 0 0;padding-left:18px;}
  .content li{font-size:13.5px;color:#4a5568;line-height:1.7;}
  @media (max-width:480px){
    .header{padding:22px 18px 18px;}
    .header h1{font-size:22px;}
    .legend{padding:12px 18px;}
    .day{padding:18px 16px 40px;}
    .timecol{flex:0 0 54px;width:54px;}
    .badge{font-size:10.5px;padding:5px 3px;border-radius:7px;}
    .item{gap:10px;}
  }
  .note{
    background:#fff8e6;
    border:1px solid #f3e0a6;
    border-radius:10px;
    padding:14px 16px;
    font-size:13px;
    color:#7a5c10;
    margin-top:10px;
  }
</style>
</head>
<body>

<div class="header">
  <h1>台北 → 倫敦　英國馬拉松行</h1>
  <div class="sub">2人 · 4月21日–4月26日（6天5夜，倫敦定點）</div>
  <div class="tagrow">
    <div class="tag">✈️ CI81 / CI82 中華航空直飛</div>
    <div class="tag">🏨 Alexandra Hotel（Paddington）Check-in 14:00 / Check-out 10:30</div>
    <div class="tag">🏃 4/24 倫敦馬拉松</div>
    <div class="tag">🎓 4/25 牛津・劍橋一日遊（Klook）</div>
  </div>
</div>

<div class="legend">
  優先級
  <span><span class="dot" style="background:var(--必去)"></span>必去</span>
  <span><span class="dot" style="background:var(--建議)"></span>建議</span>
  <span><span class="dot" style="background:var(--美食)"></span>重要提醒</span>
  <span><span class="dot" style="background:var(--備選)"></span>備選</span>
</div>

<div class="tabs" id="tabs"></div>
<div id="days"></div>

<script>
const days = [
  {

      {badge:"16:30",title:"抵達倫敦希斯洛機場",kicker:"🛬 入境",

      {badge:"14:00起",title:"Alexandra Hotel Check-in",kicker:"🏨 住宿（必去）",

        desc:"抵達首日建議早點休息，為隔天報到與後續馬拉松備戰儲備體力。",
        meta:"Boots（藥妝店）Paddington 車站及周邊就有分店，缺日用品／保養品隨時可以順路買，不用特別排時間"}
    ]
  },
  {

    items:[
      {badge:"上午",title:"前往 ExCeL London 報到領物資",kicker:"🎽 必去",
        desc:"攜帶護照／身分證件與報名確認信，領取號碼布、晶片與選手包。建議上午前往避開人潮。",

      {badge:"交通",title:"Paddington → ExCeL London",kicker:"🚇 交通",

      {badge:"下午",title:"馬拉松博覽會逛攤・賽前補給採買",kicker:"🛍️ 建議",
        desc:"可順道採買碳水補給、能量膠、壓縮腿套等賽前所需物資。"},
      {badge:"約14:30",title:"轉往 Brick Lane（磚巷）",kicker:"🚇 交通・順路",

        meta:"景點：Beigel Shop（貝果，招牌包肉貝果）・Brick Ln 塗鴉街景・VIANDAS（西班牙煙燻火腿專賣）"},
      {badge:"約16:00",title:"順遊利德賀市場（Leadenhall Market）",kicker:"📷 建議",
        desc:"從 Brick Lane 搭地鐵到 Bank／Monument 站，步行約5分鐘到利德賀市場，維多利亞式拱廊很好拍。",

      {badge:"晚上",title:"清淡晚餐・搭車返回 Paddington",kicker:"🍽️ 重要提醒",

  {

    items:[
      {badge:"上午",title:"貝克街：夏洛克·福爾摩斯雕像 ＆ 福爾摩斯紀念館",kicker:"🚶 建議・輕鬆路線",
        desc:"從 Paddington 搭地鐵到 Baker Street 站約10分鐘（或散步約20分鐘暖身即可，不宜久走）。",
        meta:"雕像在 Baker Street 站出口・紀念館在 221B Baker Street，人潮較多建議提早去"},
      {badge:"中午",title:"Attendant Coffee Roasters（Fitzrovia）",kicker:"☕ 建議",
        desc:"從貝克街步行約15分鐘到 Fitzrovia，是由維多利亞時期地下公廁改建的特色咖啡店，順道午餐咖啡。"},
      {badge:"下午",title:"大英博物館（精華快閃）",kicker:"🏛️ 建議",

        meta:"免費入場，人多時建議中午後再去人潮較少"},
      {badge:"傍晚",title:"檢查裝備",kicker:"✅ 重要提醒",
        desc:"確認號碼布、晶片、比賽服裝、鞋襪、補給膠已備妥，並熟悉隔日起點交通路線。今日以站立參觀為主，回飯店後把腳抬高休息。"},
      {badge:"晚上",title:"碳水補給晚餐・提早就寢",kicker:"🍝 必去",
        desc:"賽前一晚以好消化的碳水為主，並確保充足睡眠。"}
    ]
  },
  {
    label:"Day 4", weekday:"Saturday", date:"4月24日",
    tags:[["🏃 倫敦馬拉松比賽日"]],
    items:[
      {badge:"清晨",title:"前往起點：格林威治公園",kicker:"🏃 必去",
        desc:"倫敦馬起點在 Blackheath／格林威治公園一帶，實際起跑分區（Start Zone）要等賽事主辦方通知才會公布，公布後請再依信件上的區域與集合時間調整出發點與時間。",
        meta:"⚠️ 備選／待確認：起點分區尚未公布，出發前務必再核對官方最新公告與交通建議"},
      {badge:"比賽",title:"倫敦馬拉松・鳴槍開跑",kicker:"🏁 必去",
        desc:"祝順利完賽！沿途補給站記得適量補水與能量膠。"},
      {badge:"賽後",title:"家屬會合點：Horse Guards Parade",kicker:"👨‍👩‍👧 必去",
        desc:"終點在 The Mall，完賽後選手會沿 The Mall 走到 Horse Guards Road／Horse Guards Parade 領取行李，家屬會合區就設在這裡，並以姓氏字母分區設有告示牌方便找人。建議事先約好用哪個字母區碰面，現場人潮多手機訊號常常不穩定，別太依賴打電話聯繫。",
        meta:"最近地鐵站：Charing Cross（步行約6分鐘）／St James's Park（約7分鐘）／Embankment（約9分鐘）。選手完賽到走到會合區通常需15分鐘以上，別急著催"},
      {badge:"交通",title:"搭公車返回飯店",kicker:"🚌 交通",
        desc:"從 Trafalgar Square 搭 453 號公車，車程約25分鐘可到 Great Central Street（鄰近 Marylebone／Paddington），下車後步行約10分鐘回 Alexandra Hotel。若人數多帶著獎牌行動不便，也可視情況改搭計程車。",
        meta:"公車站牌在 Trafalgar Square／Horse Guards Avenue 周邊，人潮多時建議往南邊 St James's Park 方向找站牌會比較好上車"},
      {badge:"晚上",title:"慶功晚餐・早點休息",kicker:"🍽️ 建議",
        desc:"隔日仍有一日遊行程，建議不安排太晚的活動。"}
    ]
  },
  {
    label:"Day 5", weekday:"Sunday", date:"4月25日",
    tags:[["午餐可自理","blue"],["牛津・劍橋一日遊"]],
    items:[
      {badge:"08:05前",title:"抵達集合地點",kicker:"📍 必去",
        desc:"請於出發時間前10分鐘抵達，遲到或未出席者恕不退款。實際上車點在 40 Eastbourne Terrace（Southmead Health Services 對面），從飯店步行到帕丁頓車站方向約2分鐘即達，別跑錯到車站大廳。",
        meta:"集合地點：倫敦帕丁頓車站 Praed St, London W2 1HU（上車點：40 Eastbourne Terrace, London W2 6LG）"},
      {badge:"08:15",title:"去程出發",kicker:"🚐 Klook 牛津劍橋一日遊",
        desc:"訂單號 RHM572065・憑證號 KLK7370763546・訂購人 LIN ALVA・2人・中文導覽／可選船票"},
      {badge:"08:30",title:"搭乘汽車前往牛津",kicker:"🚗",desc:"車程約1小時30分鐘。"},
      {badge:"10:00",title:"牛津自由活動（3小時）",kicker:"🎓 建議",
        desc:"牛津大學、牛津基督教堂學院、嘆息橋、博德利圖書館、阿許莫林博物館。逛完基督教堂學院可順路走到正對面的 Alice's Shop（愛麗絲夢遊仙境原型小店），拍照選購紀念品只要5分鐘。",
        meta:"景點門票（牛津大學）需自理，不含在方案內"},
      {badge:"13:00",title:"搭乘汽車前往劍橋",kicker:"🚗",desc:"車程約2小時30分鐘。"},
      {badge:"15:30",title:"劍橋自由活動（2小時）",kicker:"🎓 建議",
        desc:"劍橋大學、劍橋盧瑟福撐船、劍橋三一學院、劍橋國王學院",
        meta:"劍橋遊船門票已含在方案內；劍橋大學門票需自理"},
      {badge:"18:30–20:00",title:"回程抵達帕丁頓火車站解散",kicker:"🏁",
        desc:"行程可能視交通與天候狀況調整。建議攜帶防曬乳／太陽眼鏡／休閒帽／雨衣，不提供行李寄放服務。"}
    ]
  },
  {
    label:"Day 6", weekday:"Monday", date:"4月26日",
    tags:[["退房","blue"],["返程"]],
    items:[
      {badge:"10:30前",title:"Alexandra Hotel Check-out",kicker:"🏨 必去",
        desc:"退房後可將行李寄放櫃台，繼續當日市區活動。賽事結束、不用再顧腿力，這天可以放心多走。"},

        desc:"從 Paddington 搭 Bakerloo/Northern line 前往 Kennington 約25–30分鐘。先到 Kennington Lane Cafe 吃早午餐，再步行至 Chris's Fish Bar 嚐英式炸魚薯條當午餐。",

      {badge:"下午",title:"返回市區・伴手禮採買",kicker:"🛍️ 備選",
        desc:"搭車回 Paddington 一帶，順路逛街採買伴手禮，注意保留返程交通時間。"},

        meta:"艙等 TWLHECB・座位 46C・飛行時間 13小時40分・行李 2件"},
      {badge:"4/27 17:50",title:"抵達台北桃園機場",kicker:"🛬 必去",
        desc:"結束此趟英國馬拉松之旅，歡迎回家！"}
    ]
  }
];

const tabsEl = document.getElementById('tabs');
const daysEl = document.getElementById('days');

days.forEach((d, i)=>{
  const tab = document.createElement('div');
  tab.className = 'tab' + (i===0?' active':'');
  tab.innerHTML = `<div class="d">${d.label} — ${d.weekday}</div><div class="date">${d.date}</div>`;
  tab.onclick = ()=>selectDay(i);
  tabsEl.appendChild(tab);

  const dayDiv = document.createElement('div');
  dayDiv.className = 'day' + (i===0?' active':'');
  dayDiv.id = 'day'+i;

  let tagsHtml = '<div class="daytags">' + d.tags.map(t=>{
    const cls = Array.isArray(t) && t[1]==='blue' ? 'daytag blue' : 'daytag';
    const label = Array.isArray(t) ? t[0] : t;
    return `<div class="${cls}">${label}</div>`;
  }).join('') + '</div>';

  let itemsHtml = '<div class="timeline">' + d.items.map(it=>`
    <div class="item">
      <div class="timecol">
        <div class="badge">${it.badge}</div>
        <div class="connector"></div>
      </div>
      <div class="content">
        <div class="kicker">${it.kicker||''}</div>
        <h3>${it.title}</h3>
        <p>${it.desc||''}</p>
        ${it.meta? `<div class="meta">${it.meta}</div>`:''}
      </div>
    </div>`).join('') + '</div>';

  dayDiv.innerHTML = tagsHtml + itemsHtml;
  daysEl.appendChild(dayDiv);
});

function selectDay(i){
  document.querySelectorAll('.tab').forEach((t,idx)=>t.classList.toggle('active', idx===i));
  document.querySelectorAll('.day').forEach((d,idx)=>d.classList.toggle('active', idx===i));
}
</script>

</body>
</html>
